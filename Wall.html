  ]},
];

const State = {
  layers: [
    makeLayer('Background', makeGenSource('flux', { ...genParams('flux'), hue: 0.55 })),
    makeLayer('Mid Layer', makeGenSource('prism', { ...genParams('prism'), hue: 0.85 })),
    makeLayer('Overlay', makeTextSource('PHANTOM')),
  ],
  selectedLayerId: null,
  selectedClip: null,
  selectedEffect: null,
  activeDeck: 0,
  master: { opacity: 1, speed: 1, freeze: false, blackout: false },
  activeClipIds: new Set(),
};
State.selectedLayerId = State.layers[0].id;

let renderer;
let startTime = performance.now();
let frozenTime = 0;
let lastFPSUpdate = 0;
let frameCount = 0;

function initRenderer() {
  const canvas = document.getElementById('preview-canvas');
  try {
    renderer = new Renderer(canvas, 1280, 720);
  } catch (e) {
    console.error('Renderer init failed:', e);
    const div = document.createElement('div');
    div.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;color:#f66;font:14px system-ui;padding:40px;text-align:center;z-index:9999;';
    div.innerHTML = '<div><h2 style="color:#ff3860;margin-bottom:12px;">Renderer Initialization Failed</h2><p style="color:#aaa;max-width:600px;line-height:1.6;">' +
      e.message + '<br><br>Check the browser console for detailed shader compilation logs.</p></div>';
    document.body.appendChild(div);
    return;
  }
  window.vjCanvas = canvas;
  updateResolutionBadge();
}

function updateResolutionBadge() {
  document.getElementById('badge-res').textContent = `${renderer.width}×${renderer.height}`;
}

function tick(now) {
  const elapsed = (now - startTime) / 1000;
  let time;
  if (State.master.freeze) {
    time = frozenTime;
  } else {
    time = elapsed * State.master.speed;
    frozenTime = time;
  }

  if (renderer) {
    try {
      renderer.render(State, time);
    } catch (e) {
      console.error('Render error:', e);
    }
  }

  frameCount++;
  if (now - lastFPSUpdate > 500) {
    const fps = Math.round(frameCount * 1000 / (now - lastFPSUpdate));
    document.getElementById('fps-display').textContent = fps;
    document.getElementById('badge-fps').textContent = fps + ' FPS';
    frameCount = 0;
    lastFPSUpdate = now;
  }

  requestAnimationFrame(tick);
}

// ============================================================================
// UI
// ============================================================================

function el(tag, props, ...children) {
  const e = document.createElement(tag);
  if (props) {
    for (const [k, v] of Object.entries(props)) {
      if (k === 'class') e.className = v;
      else if (k === 'style') e.style.cssText = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === 'html') e.innerHTML = v;
      else e.setAttribute(k, v);
    }
  }
  for (const c of children) {
    if (c === null || c === undefined) continue;
    if (typeof c === 'string' || typeof c === 'number') e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  }
  return e;
}

function getClipColor(c) {
  if (c.type === 'text') return 'linear-gradient(135deg,#ff2d95,#7c3aed)';
  if (c.type === 'image') return 'linear-gradient(135deg,#00d9ff,#7c3aed)';
  if (c.scene) return 'linear-gradient(135deg,#3a3a4e,#1e1e2e)';
  const hueMap = {
    infinite: '#1a3a5e', prism: '#5e1a3a', flux: '#3a1a5e',
    monolith: '#5e3a1a', fracture: '#1a5e3a', velocity: '#1a3a5e',
    gridline: '#3a5e1a', orbit: '#5e1a5e', disrupt: '#5e5e1a', impact: '#5e1a1a',
  };
  const base = hueMap[c.family] || '#1e1e2e';
  return `linear-gradient(135deg, ${base}, #0a0a14)`;
}

function renderDeckTabs() {
  const tabs = document.getElementById('deck-tabs');
  tabs.innerHTML = '';
  DECKS.forEach((d, i) => {
    tabs.appendChild(el('div', {
      class: 'deck-tab' + (i === State.activeDeck ? ' active' : ''),
      onclick: () => { State.activeDeck = i; renderDeckTabs(); renderClips(); },
    }, d.name));
  });
}

function renderClips() {
  const grid = document.getElementById('clips-grid');
  grid.innerHTML = '';
  const deck = DECKS[State.activeDeck];
  if (!deck) return;
  deck.clips.forEach((clip, i) => {
    const clipId = `${State.activeDeck}_${i}`;
    const isActive = State.activeClipIds.has(clipId);
    const card = el('div', {
      class: 'clip' + (isActive ? ' active' : ''),
      'data-clip-id': clipId,
    });
    const thumb = el('div', { class: 'clip-thumb' });
    thumb.style.setProperty('--clip-bg', getClipColor(clip));
    card.appendChild(thumb);
    const info = el('div', { class: 'clip-info' });
    info.appendChild(el('span', null, clip.name));
    info.appendChild(el('span', { class: 'clip-type-tag' },
      clip.scene ? 'SCENE' : clip.type === 'text' ? 'TEXT' : clip.type === 'image' ? 'IMAGE' : clip.family.toUpperCase()
    ));
    card.appendChild(info);
    card.addEventListener('click', () => launchClip(clip, clipId));
    grid.appendChild(card);
  });
}

function launchClip(clip, clipId) {
  const layer = State.layers.find(l => l.id === State.selectedLayerId);
  if (!layer) return;
  if (clip.scene) { applyScene(clip.scene); return; }

  let source;
  if (clip.type === 'text') {
    source = makeTextSource(clip.text);
    if (clip.scroll) source.config.scroll = clip.scroll;
  } else if (clip.type === 'image') {
    source = makeImageSource();
  } else {
    const params = genParams(clip.family);
    if (clip.hue !== undefined) params.hue = clip.hue;
    if (clip.segments !== undefined) params.segments = clip.segments;
    source = makeGenSource(clip.family, params);
  }

  layer.source = source;
  layer.name = clip.name;
  State.selectedClip = clipId;
  State.activeClipIds.add(clipId);
  renderLayers();
  renderInspector();
  renderClips();
}

function renderLayers() {
  const list = document.getElementById('layers-list');
  list.innerHTML = '';
  State.layers.forEach((layer) => {
    const isSel = layer.id === State.selectedLayerId;
    const card = el('div', { class: 'layer-card' + (isSel ? ' selected' : '') });

    const head = el('div', { class: 'layer-header' });
    head.addEventListener('click', (e) => {
      if (e.target.closest('button')) return;
      State.selectedLayerId = layer.id;
      State.selectedEffect = null;
      renderLayers();
      renderInspector();
    });

    head.appendChild(el('button', {
      class: 'icon-btn' + (layer.visible ? ' active' : ' off'),
      title: 'Toggle visibility',
      onclick: (e) => { e.stopPropagation(); layer.visible = !layer.visible; renderLayers(); },
    }, layer.visible ? '◉' : '○'));

    head.appendChild(el('button', {
      class: 'icon-btn' + (layer.locked ? ' warn-active' : ''),
      title: 'Toggle lock',
      onclick: (e) => { e.stopPropagation(); layer.locked = !layer.locked; renderLayers(); },
    }, layer.locked ? '🔒' : '🔓'));

    head.appendChild(el('div', { class: 'layer-name' }, layer.name));

    const srcType = layer.source.type === 'generator' ? layer.source.family : layer.source.type;
    head.appendChild(el('span', { class: 'layer-source-label' }, srcType));

    head.appendChild(el('button', {
      class: 'icon-btn', title: 'Duplicate',
      onclick: (e) => { e.stopPropagation(); duplicateLayer(layer.id); },
    }, '⎘'));
    head.appendChild(el('button', {
      class: 'icon-btn', title: 'Delete',
      onclick: (e) => { e.stopPropagation(); deleteLayer(layer.id); },
    }, '✕'));

    card.appendChild(head);

    const body = el('div', { class: 'layer-body' });

    const opRow = el('div', { class: 'layer-row' });
    opRow.appendChild(el('label', null, 'Opacity'));
    const opIn = el('input', { type: 'range', min: 0, max: 1, step: 0.01, value: layer.opacity });
    opIn.addEventListener('input', () => { layer.opacity = parseFloat(opIn.value); });
    opRow.appendChild(opIn);
    body.appendChild(opRow);

    const blendRow = el('div', { class: 'layer-row' });
    blendRow.appendChild(el('label', null, 'Blend'));
    const blendSel = el('select');
    BLEND_MODES.forEach((m, i) => {
      const o = el('option', { value: i }, m);
      if (i === layer.blend) o.selected = true;
      blendSel.appendChild(o);
    });
    blendSel.addEventListener('change', () => { layer.blend = parseInt(blendSel.value); });
    blendRow.appendChild(blendSel);
    body.appendChild(blendRow);

    const spRow = el('div', { class: 'layer-row' });
    spRow.appendChild(el('label', null, 'Speed'));
    const spIn = el('input', { type: 'range', min: 0, max: 4, step: 0.01, value: layer.speed });
    spIn.addEventListener('input', () => { layer.speed = parseFloat(spIn.value); });
    spRow.appendChild(spIn);
    body.appendChild(spRow);

    if (layer.effects.length > 0) {
      const fxWrap = el('div', { class: 'layer-effects-mini' });
      layer.effects.forEach((fx, i) => {
        fxWrap.appendChild(el('span', {
          class: 'fx-chip',
          onclick: (e) => {
            e.stopPropagation();
            State.selectedLayerId = layer.id;
            State.selectedEffect = i;
            renderLayers();
            renderInspector();
          },
        }, EFFECTS[fx.type] ? EFFECTS[fx.type].label : fx.type));
      });
      body.appendChild(fxWrap);
    }

    card.appendChild(body);
    list.appendChild(card);
  });
}

function duplicateLayer(id) {
  const idx = State.layers.findIndex(l => l.id === id);
  if (idx < 0) return;
  const orig = State.layers[idx];
  const copy = JSON.parse(JSON.stringify(orig));
  copy.id = 'layer_' + Math.random().toString(36).slice(2, 9);
  copy.name = orig.name + ' copy';
  // Preserve image refs
  if (orig.source.type === 'image' && orig.source.config.images) {
    copy.source.config.images = orig.source.config.images.map(im => ({ ...im }));
  }
  State.layers.splice(idx + 1, 0, copy);
  renderLayers();
}

function deleteLayer(id) {
  if (State.layers.length <= 1) return;
  const idx = State.layers.findIndex(l => l.id === id);
  if (idx < 0) return;
  if (renderer) renderer.disposeLayer(id);
  State.layers.splice(idx, 1);
  if (State.selectedLayerId === id) State.selectedLayerId = State.layers[0].id;
  renderLayers();
  renderInspector();
}

function renderInspector() {
  const body = document.getElementById('inspector-body');
  const target = document.getElementById('inspector-target');
  body.innerHTML = '';

  const layer = State.layers.find(l => l.id === State.selectedLayerId);
  if (!layer) {
    target.textContent = '';
    body.appendChild(el('div', { class: 'empty-state', html: '<strong>No selection</strong>Select a layer or clip to edit its parameters.' }));
    return;
  }
  target.textContent = layer.name.toUpperCase();

  body.appendChild(el('div', { class: 'inspector-title' },
    layer.name,
    el('span', { class: 'inspector-type' }, layer.source.type === 'generator' ? layer.source.family : layer.source.type)
  ));
  body.appendChild(el('div', { class: 'inspector-sub' },
    layer.source.type === 'generator' ? 'Procedural Generator' :
    layer.source.type === 'text' ? 'Text Source' : 'Image Source'
  ));

  if (layer.source.type === 'generator') buildGeneratorParams(body, layer);
  else if (layer.source.type === 'text') buildTextParams(body, layer);
  else if (layer.source.type === 'image') buildImageParams(body, layer);

  buildEffectsSection(body, layer);
}

function buildGeneratorParams(body, layer) {
  const def = GENERATORS[layer.source.family];
  if (!def) return;
  const section = el('div', { class: 'section' });
  const header = el('div', { class: 'section-header' }, 'Generator Parameters');
  const sectionBody = el('div', { class: 'section-body' });
  header.addEventListener('click', () => section.classList.toggle('collapsed'));
  section.appendChild(header);
  section.appendChild(sectionBody);

  def.params.forEach(p => {
    const val = layer.source.params[p.key] !== undefined ? layer.source.params[p.key] : p.def;
    const row = el('div', { class: 'param' });
    const lbl = el('div', { class: 'param-label' });
    lbl.appendChild(el('span', null, p.label));
    const vEl = el('span', { class: 'param-value' }, formatNum(val));
    lbl.appendChild(vEl);
    row.appendChild(lbl);
    const slider = el('input', {
      type: 'range', class: 'param-slider',
      min: p.min, max: p.max, step: p.step, value: val,
    });
    slider.addEventListener('input', () => {
      const v = parseFloat(slider.value);
      layer.source.params[p.key] = v;
      vEl.textContent = formatNum(v);
    });
    row.appendChild(slider);
    sectionBody.appendChild(row);
  });
  body.appendChild(section);
}

function buildTextParams(body, layer) {
  const cfg = layer.source.config;
  const section = el('div', { class: 'section' });
  section.appendChild(el('div', { class: 'section-header' }, 'Text Content'));
  const sb = el('div', { class: 'section-body' });
  const ta = el('textarea', { class: 'param' });
  ta.value = cfg.text;
  ta.addEventListener('input', () => { cfg.text = ta.value; });
  sb.appendChild(ta);
  section.appendChild(sb);
  body.appendChild(section);

  const typo = el('div', { class: 'section' });
  typo.appendChild(el('div', { class: 'section-header' }, 'Typography'));
  const tb = el('div', { class: 'section-body' });

  const addSelect = (label, key, options, val) => {
    const row = el('div', { class: 'param' });
    row.appendChild(el('div', { class: 'param-label' }, el('span', null, label)));
    const sel = el('select');
    options.forEach(o => {
      const opt = el('option', { value: o.v }, o.l);
      if (String(o.v) === String(val)) opt.selected = true;
      sel.appendChild(opt);
    });
    sel.addEventListener('change', () => { cfg[key] = isNaN(sel.value) ? sel.value : Number(sel.value); });
    row.appendChild(sel);
    tb.appendChild(row);
  };
  const addColor = (label, key, val) => {
    const row = el('div', { class: 'param' });
    row.appendChild(el('div', { class: 'param-label' }, el('span', null, label)));
    const inp = el('input', { type: 'color', value: val });
    inp.addEventListener('input', () => { cfg[key] = inp.value; });
    row.appendChild(inp);
    tb.appendChild(row);
  };
  const addSlider = (label, key, min, max, step, val) => {
    const row = el('div', { class: 'param' });
    const lbl = el('div', { class: 'param-label' });
    lbl.appendChild(el('span', null, label));
    const vEl = el('span', { class: 'param-value' }, formatNum(val));
    lbl.appendChild(vEl);
    row.appendChild(lbl);
    const s = el('input', { type: 'range', class: 'param-slider', min, max, step, value: val });
    s.addEventListener('input', () => {
      const v = parseFloat(s.value);
      cfg[key] = v;
      vEl.textContent = formatNum(v);
    });
    row.appendChild(s);
    tb.appendChild(row);
  };

  addSlider('Font Size', 'fontSize', 20, 400, 1, cfg.fontSize);
  addSlider('Letter Spacing', 'letterSpacing', -20, 60, 0.5, cfg.letterSpacing);
  addSlider('Line Height', 'lineHeight', 0.8, 2.5, 0.05, cfg.lineHeight);
  addSlider('Glow', 'glow', 0, 1, 0.01, cfg.glow);
  addSlider('Outline', 'outline', 0, 8, 0.1, cfg.outline);
  addColor('Color', 'color', cfg.color);
  addColor('Outline Color', 'outlineColor', cfg.outlineColor);
  addSelect('Align', 'align', [
    { v: 'left', l: 'Left' }, { v: 'center', l: 'Center' }, { v: 'right', l: 'Right' },
  ], cfg.align);
  addSelect('Scroll', 'scroll', [
    { v: 'none', l: 'None' }, { v: 'horizontal', l: 'Horizontal' },
    { v: 'vertical', l: 'Vertical' }, { v: 'up', l: 'Up' }, { v: 'down', l: 'Down' },
  ], cfg.scroll);
  addSlider('Scroll Speed', 'scrollSpeed', 0, 1, 0.01, cfg.scrollSpeed);
  addSlider('Scale', 'scale', 0.2, 3, 0.01, cfg.scale);
  addSlider('Rotation', 'rotation', -Math.PI, Math.PI, 0.01, cfg.rotation);

  typo.appendChild(tb);
  body.appendChild(typo);
}

function buildImageParams(body, layer) {
  const cfg = layer.source.config;
  const section = el('div', { class: 'section' });
  section.appendChild(el('div', { class: 'section-header' }, 'Images'));
  const sb = el('div', { class: 'section-body' });

  const uploadBtn = el('button', { class: 'btn', style: 'width:100%;margin-bottom:8px;' }, 'Upload Images');
  uploadBtn.addEventListener('click', () => {
    const fi = document.getElementById('file-input');
    fi.onchange = (e) => {
      const files = Array.from(e.target.files || []);
      let pending = files.length;
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            cfg.images.push({ src: ev.target.result, img });
            pending--;
            if (pending === 0) renderInspector();
          };
          img.onerror = () => { pending--; if (pending === 0) renderInspector(); };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
      fi.value = '';
    };
    fi.click();
  });
  sb.appendChild(uploadBtn);

  if (cfg.images.length > 0) {
    const thumbWrap = el('div', { style: 'display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;' });
    cfg.images.forEach((im, i) => {
      const th = el('div', {
        style: 'position:relative;width:60px;height:40px;background:#000;border:1px solid var(--border-2);border-radius:3px;overflow:hidden;',
      });
      if (im.img) {
        th.appendChild(el('img', { src: im.src, style: 'width:100%;height:100%;object-fit:cover;' }));
      }
      th.appendChild(el('span', {
        style: 'position:absolute;top:0;right:0;background:rgba(0,0,0,.8);color:#f66;font-size:10px;padding:0 3px;cursor:pointer;',
        onclick: (e) => { e.stopPropagation(); cfg.images.splice(i, 1); renderInspector(); },
      }, '×'));
      thumbWrap.appendChild(th);
    });
    sb.appendChild(thumbWrap);
  }

  const durRow = el('div', { class: 'param' });
  const durLbl = el('div', { class: 'param-label' });
  durLbl.appendChild(el('span', null, 'Slide Duration'));
  const durVal = el('span', { class: 'param-value' }, cfg.duration + 's');
  durLbl.appendChild(durVal);
  durRow.appendChild(durLbl);
  const durSl = el('input', { type: 'range', class: 'param-slider', min: 0.5, max: 15, step: 0.1, value: cfg.duration });
  durSl.addEventListener('input', () => { cfg.duration = parseFloat(durSl.value); durVal.textContent = cfg.duration.toFixed(1) + 's'; });
  durRow.appendChild(durSl);
  sb.appendChild(durRow);

  section.appendChild(sb);
  body.appendChild(section);
}

function buildEffectsSection(body, layer) {
  const section = el('div', { class: 'section' });
  section.appendChild(el('div', { class: 'section-header' }, `Effects (${layer.effects.length})`));
  const sb = el('div', { class: 'section-body' });

  layer.effects.forEach((fx, i) => {
    const def = EFFECTS[fx.type];
    if (!def) return;
    const item = el('div', { class: 'effect-item' + (State.selectedEffect === i ? ' selected' : '') });
    const head = el('div', { class: 'effect-item-head' });
    head.appendChild(el('span', { class: 'drag-handle' }, '⋮⋮'));
    head.appendChild(el('span', { class: 'effect-name' }, def.label));
    head.appendChild(el('span', {
      class: 'icon-btn' + (fx.enabled ? ' active' : ' off'),
      style: 'font-size:10px;',
      onclick: (e) => { e.stopPropagation(); fx.enabled = !fx.enabled; renderInspector(); },
      title: 'Toggle',
    }, fx.enabled ? '◉' : '○'));
    head.appendChild(el('span', {
      class: 'remove-fx',
      onclick: (e) => { e.stopPropagation(); layer.effects.splice(i, 1); renderInspector(); renderLayers(); },
    }, '✕'));
    head.addEventListener('click', (e) => {
      if (e.target.closest('.remove-fx') || e.target.closest('.icon-btn')) return;
      State.selectedEffect = State.selectedEffect === i ? null : i;
      renderInspector();
    });
    item.appendChild(head);

    if (State.selectedEffect === i) {
      const fxb = el('div', { class: 'effect-item-body' });
      def.params.forEach(p => {
        const val = fx.params[p.key] !== undefined ? fx.params[p.key] : p.def;
        const row = el('div', { class: 'param' });
        const lbl = el('div', { class: 'param-label' });
        lbl.appendChild(el('span', null, p.label));
        const vEl = el('span', { class: 'param-value' }, formatNum(val));
        lbl.appendChild(vEl);
        row.appendChild(lbl);
        const s = el('input', { type: 'range', class: 'param-slider', min: p.min, max: p.max, step: p.step, value: val });
        s.addEventListener('input', () => {
          const v = parseFloat(s.value);
          fx.params[p.key] = v;
          vEl.textContent = formatNum(v);
        });
        row.appendChild(s);
        fxb.appendChild(row);
      });
      item.appendChild(fxb);
    }
    sb.appendChild(item);
  });

  sb.appendChild(el('div', { class: 'fx-category' }, 'Add Effect'));

  const categories = {};
  Object.entries(EFFECTS).forEach(([k, e]) => {
    if (!categories[e.category]) categories[e.category] = [];
    categories[e.category].push({ key: k, ...e });
  });
  Object.entries(categories).forEach(([cat, list]) => {
    sb.appendChild(el('div', {
      style: 'font-size:9px;color:var(--text-dim);margin:6px 0 3px;letter-spacing:.8px;text-transform:uppercase;',
    }, cat));
    const wrap = el('div', { style: 'display:flex;flex-wrap:wrap;gap:3px;margin-bottom:6px;' });
    list.forEach(e => {
      wrap.appendChild(el('span', {
        class: 'fx-add-btn',
        onclick: () => {
          const params = {};
          e.params.forEach(p => params[p.key] = p.def);
          layer.effects.push({ type: e.key, params, enabled: true });
          renderInspector();
          renderLayers();
        },
      }, '+ ' + e.label));
    });
    sb.appendChild(wrap);
  });

  section.appendChild(sb);
  body.appendChild(section);
}

function formatNum(v) {
  if (typeof v !== 'number') return v;
  if (Number.isInteger(v)) return String(v);
  return v.toFixed(Math.abs(v) < 1 ? 3 : 2);
}

function applyScene(name) {
  if (name === 'standby') {
    State.layers = [
      makeLayer('Standby BG', makeGenSource('flux', { ...genParams('flux'), hue: 0.6, scale: 1.2, contrast: 0.7 })),
      makeLayer('Standby Text', makeTextSource('STAND BY')),
    ];
    State.layers[0].opacity = 0.7;
    State.layers[1].opacity = 0.6;
  } else if (name === 'intro') {
    State.layers = [
      makeLayer('Intro BG', makeGenSource('infinite', { ...genParams('infinite'), hue: 0.55 })),
      makeLayer('Intro Prism', makeGenSource('prism', { ...genParams('prism'), hue: 0.85 })),
      makeLayer('Intro Text', makeTextSource('PHANTOM')),
    ];
    State.layers[2].effects.push({ type: 'bloom', params: { amount: 1.2, radius: 2 }, enabled: true });
  } else if (name === 'main') {
    State.layers = [
      makeLayer('Background', makeGenSource('flux', { ...genParams('flux'), hue: 0.5 })),
      makeLayer('Mid Layer', makeGenSource('prism', { ...genParams('prism'), hue: 0.85 })),
      makeLayer('Top', makeGenSource('velocity', { ...genParams('velocity'), hue: 0.1 })),
    ];
    State.layers[2].blend = 1;
    State.layers[2].opacity = 0.7;
  } else if (name === 'outro') {
    State.layers = [
      makeLayer('Outro BG', makeGenSource('flux', { ...genParams('flux'), hue: 0.3, speed: 0.4 })),
      makeLayer('Outro Text', makeTextSource('THANK YOU')),
    ];
    State.layers[1].effects.push({ type: 'bloom', params: { amount: 0.8, radius: 3 }, enabled: true });
  }
  State.selectedLayerId = State.layers[0].id;
  State.selectedEffect = null;
  State.activeClipIds.clear();
  renderLayers();
  renderInspector();
  renderClips();
}

function triggerAction(action) {
  const layer = State.layers.find(l => l.id === State.selectedLayerId);
  if (!layer) return;

  const addTempFx = (type, params, duration) => {
    const fx = { type, params, enabled: true };
    layer.effects.push(fx);
    setTimeout(() => {
      const idx = layer.effects.indexOf(fx);
      if (idx >= 0) layer.effects.splice(idx, 1);
      renderInspector();
      renderLayers();
    }, duration);
    renderInspector();
  };

  switch (action) {
    case 'morph':
      if (layer.source.type === 'generator') {
        const def = GENERATORS[layer.source.family];
        def.params.forEach(p => {
          if (p.key === 'hue') layer.source.params.hue = Math.random();
        });
      }
      break;
    case 'shatter':
      addTempFx('kaleidoscope', { sides: 8, rotation: 0.5 }, 2000);
      addTempFx('glitch', { amount: 0.15, blocks: 30 }, 1500);
      break;
    case 'explode':
      addTempFx('rgbsplit', { amount: 0.05 }, 1000);
      addTempFx('zoom', { amount: 0.4 }, 800);
      break;
    case 'collapse':
      addTempFx('zoom', { amount: 3 }, 1500);
      break;
    case 'invert':
      addTempFx('invert', { amount: 1 }, 600);
      break;
    case 'glitch':
      addTempFx('glitch', { amount: 0.2, blocks: 40 }, 1200);
      break;
    case 'shockwave':
      addTempFx('ripple', { amount: 0.1, freq: 30 }, 1200);
      break;
    case 'hueshift':
      if (layer.source.type === 'generator') {
        layer.source.params.hue = Math.random();
      } else {
        addTempFx('hue', { amount: Math.random() }, 1500);
      }
      break;
  }
}

let projectorWindow = null;
function openProjector() {
  if (projectorWindow && !projectorWindow.closed) { projectorWindow.focus(); return; }
  projectorWindow = window.open('', 'VJProjector', 'width=1280,height=720');
  if (!projectorWindow) { alert('Please allow popups to open the projector output.'); return; }
  projectorWindow.document.write(`<!DOCTYPE html>
<html><head><title>Projector Output</title>
<style>
  * { margin: 0; padding: 0; }
  html, body { background: #000; width: 100%; height: 100%; overflow: hidden; cursor: none; }
  #vid { width: 100vw; height: 100vh; object-fit: contain; display: block; background: #000; }
  #hint { position: fixed; top: 16px; left: 16px; color: #666; font: 11px system-ui; letter-spacing: 1px; }
</style></head><body>
<video id="vid" autoplay muted playsinline></video>
<div id="hint">CLICK FOR FULLSCREEN</div>
<script>
  const vid = document.getElementById('vid');
  const srcCanvas = window.opener.vjCanvas;
  if (srcCanvas) {
    const stream = srcCanvas.captureStream(60);
    vid.srcObject = stream;
    vid.play().catch(e => console.warn(e));
  }
  document.body.addEventListener('click', () => {
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  });
  setTimeout(() => { document.getElementById('hint').style.display = 'none'; }, 4000);
<\/script>
</body></html>`);
  projectorWindow.document.close();
  setTimeout(() => {
    document.getElementById('out-dot').classList.remove('off');
    document.getElementById('out-status').textContent = 'Connected';
    const check = setInterval(() => {
      if (!projectorWindow || projectorWindow.closed) {
        document.getElementById('out-dot').classList.add('off');
        document.getElementById('out-status').textContent = 'Disconnected';
        clearInterval(check);
      }
    }, 1000);
  }, 500);
}

function initControls() {
  document.getElementById('master-opacity').addEventListener('input', (e) => {
    State.master.opacity = parseFloat(e.target.value);
  });
  document.getElementById('master-speed').addEventListener('input', (e) => {
    State.master.speed = parseFloat(e.target.value);
  });
  document.getElementById('btn-freeze').addEventListener('click', (e) => {
    State.master.freeze = !State.master.freeze;
    e.target.classList.toggle('active', State.master.freeze);
  });
  document.getElementById('btn-blackout').addEventListener('click', (e) => {
    State.master.blackout = !State.master.blackout;
    e.target.classList.toggle('active', State.master.blackout);
  });
  document.getElementById('btn-output').addEventListener('click', openProjector);

  const addLayer = () => {
    const layer = makeLayer(`Layer ${State.layers.length + 1}`, makeGenSource('flux'));
    State.layers.push(layer);
    State.selectedLayerId = layer.id;
    renderLayers();
    renderInspector();
  };
  document.getElementById('add-layer-btn').addEventListener('click', addLayer);
  document.getElementById('add-layer-btn-2').addEventListener('click', addLayer);

  document.querySelectorAll('[data-trigger]').forEach(btn => {
    btn.addEventListener('click', () => {
      triggerAction(btn.dataset.trigger);
      btn.classList.add('pulse');
      setTimeout(() => btn.classList.remove('pulse'), 300);
    });
  });

  document.querySelectorAll('[data-scene]').forEach(btn => {
    btn.addEventListener('click', () => applyScene(btn.dataset.scene));
  });

  document.getElementById('btn-save').addEventListener('click', saveProject);
  document.getElementById('btn-load').addEventListener('click', loadProject);
  document.getElementById('btn-reset').addEventListener('click', () => {
    if (confirm('Reset the entire composition?')) location.reload();
  });

  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
    if (e.key === ' ') {
      e.preventDefault();
      State.master.freeze = !State.master.freeze;
      document.getElementById('btn-freeze').classList.toggle('active', State.master.freeze);
    } else if (e.key === 'b' || e.key === 'B') {
      State.master.blackout = !State.master.blackout;
      document.getElementById('btn-blackout').classList.toggle('active', State.master.blackout);
    } else if (e.key === 'o' || e.key === 'O') {
      openProjector();
    } else if (e.key >= '1' && e.key <= '9') {
      const idx = parseInt(e.key) - 1;
      const deck = DECKS[State.activeDeck];
      if (deck && deck.clips[idx]) launchClip(deck.clips[idx], `${State.activeDeck}_${idx}`);
    }
  });
}

function serializeState() {
  const layers = State.layers.map(l => {
    const src = JSON.parse(JSON.stringify(l.source));
    if (src.type === 'image' && src.config.images) {
      src.config.images = src.config.images.map(im => ({ src: im.src }));
    }
    return { ...l, source: src };
  });
  return { layers, master: State.master, activeDeck: State.activeDeck };
}

function saveProject() {
  try {
    const data = serializeState();
    localStorage.setItem('vj_project', JSON.stringify(data));
    alert('Project saved locally.');
  } catch (e) {
    alert('Save failed: ' + e.message);
  }
}

function loadProject() {
  try {
    const raw = localStorage.getItem('vj_project');
    if (!raw) { alert('No saved project found.'); return; }
    const data = JSON.parse(raw);
    State.layers = (data.layers || []).map(l => {
      if (l.source.type === 'image' && l.source.config.images) {
        l.source.config.images.forEach(im => {
          if (im.src && !im.img) {
            const img = new Image();
            img.src = im.src;
            im.img = img;
          }
        });
      }
      return l;
    });
    State.master = data.master || State.master;
    State.activeDeck = data.activeDeck || 0;
    State.selectedLayerId = State.layers[0] ? State.layers[0].id : null;
    document.getElementById('master-opacity').value = State.master.opacity;
    document.getElementById('master-speed').value = State.master.speed;
    document.getElementById('btn-freeze').classList.toggle('active', State.master.freeze);
    document.getElementById('btn-blackout').classList.toggle('active', State.master.blackout);
    renderDeckTabs();
    renderClips();
    renderLayers();
    renderInspector();
  } catch (e) {
    alert('Load failed: ' + e.message);
  }
}

function fitPreview() {
  const wrap = document.getElementById('preview-wrap');
  const area = document.getElementById('preview-area');
  if (!area || !wrap) return;
  const pad = 24;
  const aw = area.clientWidth - pad;
  const ah = area.clientHeight - pad;
  const ar = 16 / 9;
  let w = aw, h = aw / ar;
  if (h > ah) { h = ah; w = ah * ar; }
  wrap.style.width = w + 'px';
  wrap.style.height = h + 'px';
}
window.addEventListener('resize', fitPreview);
setTimeout(fitPreview, 100);

window.addEventListener('load', () => {
  initRenderer();
  if (renderer) {
    renderDeckTabs();
    renderClips();
    renderLayers();
    renderInspector();
    initControls();
    requestAnimationFrame(tick);
  }
});
// ============================================================================
// AUTH GATE
// ============================================================================
const AUTH_USER = 'admin';
const AUTH_HASH = 'dd95db32bf970aae92e5345c13044562a626165e15d1789cdf4eafaf63ee788e';

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}

function startApp() {
  document.body.classList.remove('locked');
  initRenderer();
  if (renderer) {
    renderDeckTabs();
    renderClips();
    renderLayers();
    renderInspector();
    initControls();
    fitPreview();
    requestAnimationFrame(tick);
  }
}

async function tryUnlock() {
  const uEl = document.getElementById('lock-user');
  const pEl = document.getElementById('lock-pass');
  const errEl = document.getElementById('lock-err');
  errEl.textContent = '';
  if (!uEl.value || !pEl.value) { errEl.textContent = 'Enter both fields.'; return; }
  const h = await sha256(pEl.value);
  if (uEl.value === AUTH_USER && h === AUTH_HASH) {
    startApp();
  } else {
    errEl.textContent = 'Access denied.';
    pEl.value = '';
    pEl.focus();
  }
}

window.addEventListener('load', () => {
  document.getElementById('lock-btn').addEventListener('click', tryUnlock);
  document.getElementById('lock-pass').addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });
  document.getElementById('lock-user').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('lock-pass').focus(); });
  document.getElementById('lock-user').focus();
});
